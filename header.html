<body class="flex">
     <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-lg transform -translate-x-full transition-transform sm:translate-x-0 sm:static sm:block sm:hidden">
</aside>
<header class="bg-white border-b border-[#E6E9F0] px-4 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
  <!-- Kiri (mobile: toggle + title, desktop: cuma title) -->
<div class="flex items-center justify-between w-full sm:w-auto">
  <!-- Toggle kiri -->
 <button id="menu-toggle" class="text-2xl text-[#2E2E5C] focus:outline-none sm:hidden">
  <i class="fas fa-bars"></i>
</button>
  <!-- Judul tengah, lebar penuh -->
  <h1 id="page-title" class="w-full text-center text-base md:text-lg lg:text-xl font-semibold text-[#2E2E5C] select-none">
    Credit Cards 
  </h1>
  <!-- Foto kanan -->
  <img alt="Profile photo" class="w-10 h-10 rounded-full object-cover sm:hidden" src="img/foto1.jpg" width="40" height="40" />
</div>
  <!-- Kanan (search + icons + profile) -->
  <div class="flex items-center gap-4 w-full sm:justify-end">
    <!-- Search bar -->
    <div class="w-full flex justify-center sm:justify-end">
  <div class="relative w-full max-w-[300px] sm:flex-none sm:w-72">
    <input class="w-full rounded-full bg-[#F4F7FF] py-2 pl-10 pr-4 text-sm text-[#9CA3AF] placeholder-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="Search for something" type="search" />
    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-[#9CA3AF]"></i>
  </div>
</div>
    <!-- Settings icon: hidden on mobile -->
    <button aria-label="Settings" class="hidden sm:block bg-[#F4F7FF] p-2 rounded-full text-[#9CA3AF] hover:text-[#2E2E5C] transition-colors">
      <i class="fas fa-cog"></i>
    </button>
    <!-- Notifications icon: hidden on mobile -->
    <button aria-label="Notifications" class="hidden sm:block bg-[#F4F7FF] p-2 rounded-full text-[#F87171] hover:text-[#B91C1C] transition-colors relative">
      <i class="fas fa-bell"></i>
      <span class="absolute top-0 right-0 block w-2 h-2 rounded-full bg-[#F87171]"></span>
    </button>
    <!-- Profile photo -->
    <img alt="Profile photo" class=" hidden sm:block w-10 h-10 rounded-full" src="img/foto1.jpg" width="40" height="40" />
  </div>
</header>
</body>
